    <!-- Vælg hvilken case der skal simuleres -->

        <select id="caseValg">
            <option value="">-- Vælg en case --</option>
        </select>
    </label>
    <br>
    <label>Simuleringsperiode (år):
        <input type="number" id="periode" value="30" min="1" max="50">

    <button id="simuleringBtn">Kør simulering</button>

    <!-- Resultater -->
    <div id="resultater" style="display:none">
        <h2>Resultater for: <span id="caseNavn"></span></h2>
        <canvas id="simuleringGraf"></canvas>
        <div id="tabel"></div>
    </div>
